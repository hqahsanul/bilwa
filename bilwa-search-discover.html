<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find something worth keeping · Bilwa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f5ef; --card:#fcfaf6; --field:#f4f6ef; --line:#e0ddd0; --ink:#173326; --muted:#657067;
  --green:#12452f; --green-2:#0e3825; --tint:#e4eadc; --gold:#b98a3e; --onbtn:#fff; --ph:#e6e1d4; --ph-ink:#8a8672;
  --banner:linear-gradient(100deg,#f3eee3 0%,#f5f0e5 50%,#eadfc8 100%);
  --gutter:clamp(16px,calc((100vw - 1000px)/2),280px);
  --serif:Newsreader,Georgia,"Times New Roman",serif; --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1713; --card:#16201a; --field:#1f2d24; --line:#2b3a31; --ink:#e8efe6; --muted:#9db0a2;
  --green:#3f8a63; --green-2:#357853; --tint:#223428; --gold:#d3a85a; --onbtn:#0b130e; --ph:#222d26; --ph-ink:#7d9285;
  --banner:linear-gradient(100deg,#141d18 0%,#17221b 50%,#262a1f 100%);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1713; --card:#16201a; --field:#1f2d24; --line:#2b3a31; --ink:#e8efe6; --muted:#9db0a2;
  --green:#3f8a63; --green-2:#357853; --tint:#223428; --gold:#d3a85a; --onbtn:#0b130e; --ph:#222d26; --ph-ink:#7d9285;
  --banner:linear-gradient(100deg,#141d18 0%,#17221b 50%,#262a1f 100%);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.band,.page{margin-left:var(--gutter);margin-right:var(--gutter)}

.ph{background:repeating-linear-gradient(135deg,var(--ph) 0 10px,color-mix(in srgb,var(--ph) 88%,var(--ink)) 10px 11px);color:var(--ph-ink);display:grid;place-items:center}
.ph svg{font-size:28px;opacity:.6}

/* hero */
.hero{position:relative;margin-top:20px;background:var(--banner);border:1px solid var(--line);border-radius:12px;padding:30px 32px 26px;overflow:hidden;isolation:isolate}
.hero-img{position:absolute;inset:0 0 0 auto;width:52%;z-index:-1;-webkit-mask-image:linear-gradient(to right,transparent,#000 55%);mask-image:linear-gradient(to right,transparent,#000 55%)}
.hero h1{font:500 36px/1.15 var(--serif);margin:0 0 16px;letter-spacing:-.005em}
.search{display:flex;align-items:center;gap:10px;width:min(100%,520px);height:46px;padding:0 6px 0 18px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:0 1px 3px rgba(23,51,38,.06)}
.search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}
.search>svg{font-size:20px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:500 16px var(--serif);height:100%}
.search .go{width:34px;height:34px;border-radius:50%;border:0;background:var(--green);color:var(--onbtn);display:grid;place-items:center;font-size:16px}
.search .go:hover{background:var(--green-2)}
.sugg{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:14px;font:400 14px var(--serif)}
.sugg button{height:28px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:400 13px var(--serif)}
.sugg button:hover{background:var(--tint)}

/* filter bar */
.fbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.fbar .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.dd{position:relative}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;height:42px;min-width:120px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--field);font:400 15px var(--serif)}
.dd-btn:hover,.dd-btn[aria-expanded="true"]{border-color:var(--green)}
.dd-btn.on{border-color:var(--green);background:var(--tint)}
.dd-btn svg{font-size:14px;color:var(--muted);transition:transform .15s}
.dd-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.dd.sortdd{margin-left:0}
.dd.sortdd .dd-btn{min-width:200px}
.dd-list{position:absolute;top:calc(100% + 8px);left:0;min-width:200px;margin:0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 30px rgba(23,51,38,.16);z-index:25;outline:0}
.dd.sortdd .dd-list{left:auto;right:0}
.dd-list[hidden]{display:none}
.dd-list li{padding:9px 12px;border-radius:8px;font:400 14px var(--serif);cursor:pointer;display:flex;align-items:center;gap:10px;white-space:nowrap}
.dd-list li:hover,.dd-list li.act{background:var(--tint)}
.dd-list .bx{width:15px;height:15px;border:1.3px solid var(--muted);border-radius:3px;background:var(--field);display:grid;place-items:center;flex:none}
.dd-list li[aria-selected="true"] .bx{background:var(--green);border-color:var(--green)}
.dd-list li[aria-selected="true"] .bx::after{content:"";width:3.5px;height:7px;border:solid var(--onbtn);border-width:0 1.8px 1.8px 0;transform:rotate(45deg) translate(-.5px,-.5px)}
.dd.sortdd li[aria-selected="true"]{color:var(--green);font-weight:600}
.dd.sortdd .bx{display:none}

.count{margin:22px 0 14px;font:400 16px var(--serif);color:var(--ink)}
.count i{font-style:italic}

/* grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(23,51,38,.05)}
.media{position:relative;aspect-ratio:1.45/1}
.media .ph{position:absolute;inset:0}
.heart{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:0;background:color-mix(in srgb,var(--card) 92%,transparent);display:grid;place-items:center;font-size:16px}
.heart[aria-pressed="true"]{color:#b4432f}
.heart[aria-pressed="true"] svg{fill:currentColor}
.card .b{padding:14px 16px 16px}
.card h3{font:500 17px/1.3 var(--serif);margin:0 0 2px}
.m{font:400 13px var(--serif);color:var(--muted);margin:0}
.tag{display:inline-block;margin:8px 0 6px;padding:2px 12px;border-radius:999px;background:var(--tint);border:1px solid var(--line);font:400 12px var(--serif)}
.price{display:block;font:600 21px var(--serif)}
.empty{grid-column:1/-1;padding:46px 0;text-align:center;color:var(--muted);font:400 16px var(--serif)}

/* footer row */
.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:26px 0 34px}
.scroll{flex:1;display:flex;align-items:center;gap:16px;min-width:260px;font:400 14px var(--serif)}
.scroll::before,.scroll::after{content:"";flex:1;height:1px;background:var(--line)}
.spin{font-size:18px;color:var(--gold);animation:sp 1.6s linear infinite}
.spin svg{stroke-dasharray:2.5 3.2;stroke-width:2.2}
@keyframes sp{to{transform:rotate(360deg)}}
.nomatch{display:inline-flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 18px rgba(23,51,38,.10);font:400 15px var(--serif)}
.nomatch>svg{font-size:22px}
.nomatch .sp{width:1px;height:20px;background:var(--line)}
.nomatch button,.nomatch a{background:none;border:0;padding:0;color:var(--green);font:500 14px var(--serif);text-decoration:underline;text-underline-offset:3px}
.nomatch a{color:#8a5a14;text-decoration:none}
.nomatch a:hover{text-decoration:underline}

@media (max-width:980px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-img{width:70%;opacity:.55}
  .fbar .sep{display:none}
}
@media (max-width:600px){
  .hero{padding:22px 16px}
  .hero h1{font-size:28px}
  .grid{grid-template-columns:1fr}
  .dd-btn{min-width:0;padding:0 14px}
  .dd.sortdd .dd-btn{min-width:170px}
  .nomatch{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-4 3.5V16H4z"/><path d="M9 10.5h.01M12 10.5h.01M15 10.5h.01"/></symbol>
  <symbol id="i-spin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
</svg>

<main>
  <section class="band hero" aria-label="Search">
    <div class="hero-img ph" role="img" aria-label="Image placeholder"><svg><use href="#i-img"/></svg></div>
    <h1>Find something worth keeping.</h1>
    <form class="search" role="search" id="sf">
      <svg><use href="#i-search"/></svg>
      <input id="q" type="search" value="gold coin" aria-label="Search products" autocomplete="off">
      <button class="go" type="submit" aria-label="Search"><svg><use href="#i-arrow"/></svg></button>
    </form>
    <div class="sugg" id="sugg"><span>Suggestions:</span>
      <button type="button">Lakshmi</button><button type="button">Lotus</button><button type="button">1 g</button><button type="button">Gifting</button>
    </div>
  </section>

  <div class="page">
    <div class="fbar" id="fbar"></div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <div class="foot">
      <div class="scroll" id="scroll"><span class="spin"><svg><use href="#i-spin"/></svg></span>Scroll to discover more</div>
      <div class="nomatch"><svg><use href="#i-chat"/></svg>No matches? <i class="sp"></i><button id="clear" type="button">Clear filters</button> / <a href="#">Ask Bilwa ›</a></div>
    </div>
    <div id="sentinel" aria-hidden="true"></div>
  </div>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var fmt=function(n){return '₹'+n.toLocaleString('en-IN')};
  var base=[['Lakshmi',1,['Diwali','Wedding']],['Lotus',1,['Gifting','Diwali']],['Ganesha',2,['Wedding','Gifting']],['Tree of Life',5,['Gifting']],
    ['Lakshmi',2,['Diwali','Wedding']],['Lotus',5,['Gifting','Diwali']],['Ganesha',5,['Wedding','Gifting']],['Tree of Life',10,['Gifting']],
    ['Lakshmi',10,['Diwali','Wedding']],['Lotus',10,['Gifting','Diwali']],['Ganesha',20,['Wedding','Gifting']],['Lakshmi',20,['Diwali','Wedding']]];
  var items=base.map(function(b,i){return {i:i,n:b[0],g:b[1],occ:b[2],p:b[1]*13850}});
  var bands=[['Below ₹25,000',0,25000],['₹25,000 – ₹1,00,000',25000,100000],['₹1,00,000 – ₹2,00,000',100000,200000],['Above ₹2,00,000',200000,Infinity]];
  var filters=[
    {k:'metal',l:'Metal',o:['Gold','Silver'],t:function(x,v){return v==='Gold'}},
    {k:'purity',l:'Purity',o:['24K (999)','22K (916)'],t:function(x,v){return v==='24K (999)'}},
    {k:'weight',l:'Weight',o:['1 g','2 g','5 g','10 g','20 g'],t:function(x,v){return x.g===parseInt(v)}},
    {k:'occasion',l:'Occasion',o:['Diwali','Wedding','Gifting'],t:function(x,v){return x.occ.indexOf(v)>-1}},
    {k:'price',l:'Price',o:bands.map(function(b){return b[0]}),t:function(x,v){var b=bands.filter(function(y){return y[0]===v})[0];return x.p>=b[1]&&x.p<b[2]}}
  ];
  var sorts=[['rel','Relevant'],['lo','Price: Low to High'],['hi','Price: High to Low']];
  var sel={},sort='rel',shown=8,ph='<div class="ph" role="img" aria-label="Product image placeholder"><svg><use href="#i-img"/></svg></div>';
  filters.forEach(function(f){sel[f.k]=[]});

  /* dropdowns */
  var bar=$('fbar'),openDD=null;
  function chev(){return '<svg><use href="#i-chev"/></svg>'}
  bar.innerHTML=filters.map(function(f){
    return '<div class="dd" data-k="'+f.k+'"><button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"><span>'+f.l+'</span>'+chev()+'</button>'+
      '<ul class="dd-list" role="listbox" aria-multiselectable="true" tabindex="-1" hidden>'+f.o.map(function(o){return '<li role="option" aria-selected="false" data-v="'+o+'"><span class="bx"></span>'+o+'</li>'}).join('')+'</ul></div>';
  }).join('')+'<i class="sep"></i><div class="dd sortdd" data-k="sort"><button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"><span>Sort: Relevant</span>'+chev()+'</button>'+
    '<ul class="dd-list" role="listbox" tabindex="-1" hidden>'+sorts.map(function(s,i){return '<li role="option" aria-selected="'+(i===0)+'" data-v="'+s[0]+'"><span class="bx"></span>'+s[1]+'</li>'}).join('')+'</ul></div>';

  function close(){
    if(!openDD)return;
    openDD.querySelector('.dd-list').hidden=true;openDD.querySelector('.dd-btn').setAttribute('aria-expanded','false');openDD=null;
  }
  function open(dd){
    close();openDD=dd;dd.querySelector('.dd-list').hidden=false;dd.querySelector('.dd-btn').setAttribute('aria-expanded','true');dd.querySelector('.dd-list').focus();
  }
  function label(dd){
    var k=dd.dataset.k,btn=dd.querySelector('.dd-btn span');
    if(k==='sort'){btn.textContent='Sort: '+sorts.filter(function(s){return s[0]===sort})[0][1];return}
    var n=sel[k].length,f=filters.filter(function(x){return x.k===k})[0];
    btn.textContent=f.l+(n?' ('+n+')':'');dd.querySelector('.dd-btn').classList.toggle('on',n>0);
  }
  bar.addEventListener('click',function(e){
    var dd=e.target.closest('.dd');if(!dd)return;
    var li=e.target.closest('li');
    if(li){
      var k=dd.dataset.k,v=li.dataset.v;
      if(k==='sort'){
        sort=v;[].slice.call(dd.querySelectorAll('li')).forEach(function(x){x.setAttribute('aria-selected',x===li)});close();dd.querySelector('.dd-btn').focus();
      }else{
        var a=sel[k],ix=a.indexOf(v);ix>-1?a.splice(ix,1):a.push(v);
        li.setAttribute('aria-selected',ix===-1);
      }
      label(dd);shown=8;render();return;
    }
    if(e.target.closest('.dd-btn')){openDD===dd?close():open(dd)}
  });
  bar.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&openDD){var b=openDD.querySelector('.dd-btn');close();b.focus()}
  });
  document.addEventListener('click',function(e){if(openDD&&!openDD.contains(e.target))close()});

  /* results */
  function parseQ(){
    var q=$('q').value.toLowerCase().trim(),w=null,m=q.match(/(\d+)\s*g\b/);
    if(m){w=+m[1];q=q.replace(m[0],' ')}
    return {t:q.split(/\s+/).filter(Boolean),w:w,raw:$('q').value.trim()};
  }
  function list(){
    var pq=parseQ();
    var r=items.filter(function(x){
      var hay=(x.n+' gold coin 24k 999 '+x.occ.join(' ')).toLowerCase();
      if(!pq.t.every(function(t){return hay.indexOf(t)>-1}))return false;
      if(pq.w!==null&&x.g!==pq.w)return false;
      return filters.every(function(f){var s=sel[f.k];return !s.length||s.some(function(v){return f.t(x,v)})});
    });
    if(sort==='lo')r.sort(function(a,b){return a.p-b.p});
    if(sort==='hi')r.sort(function(a,b){return b.p-a.p});
    return {r:r,q:pq.raw||'gold coin'};
  }
  function render(){
    var L=list(),r=L.r,vis=r.slice(0,shown);
    $('count').innerHTML=r.length+' result'+(r.length===1?'':'s')+' for <i></i>';
    $('count').querySelector('i').textContent=L.q;
    $('grid').innerHTML=vis.length?vis.map(function(x){
      return '<article class="card"><div class="media">'+ph+
        '<button class="heart" type="button" aria-pressed="false" aria-label="Save to wishlist"><svg><use href="#i-heart"/></svg></button></div>'+
        '<div class="b"><h3>'+x.n+' Gold Coin – '+x.g+' g</h3><p class="m">24K • 999 Purity</p>'+
        '<span class="tag">Indicative price</span><span class="price">'+fmt(x.p)+'</span></div></article>';
    }).join(''):'<p class="empty">No matches for these filters. Try clearing a filter or ask Bilwa.</p>';
    $('scroll').style.visibility=shown<r.length?'visible':'hidden';
  }
  $('grid').addEventListener('click',function(e){
    var h=e.target.closest('.heart');if(h)h.setAttribute('aria-pressed',h.getAttribute('aria-pressed')!=='true');
  });
  $('sf').addEventListener('submit',function(e){e.preventDefault();shown=8;render()});
  $('q').addEventListener('input',function(){shown=8;render()});
  $('sugg').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    $('q').value='gold coin '+b.textContent;shown=8;render();
  });
  $('clear').addEventListener('click',function(){
    filters.forEach(function(f){sel[f.k]=[]});sort='rel';
    [].slice.call(bar.querySelectorAll('li')).forEach(function(li){
      var dd=li.closest('.dd');li.setAttribute('aria-selected',dd.dataset.k==='sort'&&li.dataset.v==='rel')});
    [].slice.call(bar.querySelectorAll('.dd')).forEach(label);
    $('q').value='gold coin';shown=8;render();
  });
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(en){
      if(en[0].isIntersecting&&shown<list().r.length){shown+=4;render()}
    },{rootMargin:'0px 0px 120px 0px'}).observe($('sentinel'));
  }
  render();
})();
</script>
</body>
</html>
